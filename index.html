<title>Plant Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root {
    --bg: #f4f2ec;
    --surface: #ffffff;
    --surface-2: #ebe8e0;
    --border: #d9d5c9;
    --text: #1c211f;
    --text-muted: #5c6560;
    --text-faint: #8d948d;
    --accent: #2b6e63;
    --accent-strong: #1e5147;
    --accent-tint: #e2ede9;
    --amber: #b3701f;
    --amber-tint: #f5e9d7;
    --danger: #a3402f;
    --focus-ring: #2b6e6355;
    --shadow: 0 1px 2px rgba(28,33,31,0.06), 0 6px 20px -8px rgba(28,33,31,0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a18;
      --surface: #1b2220;
      --surface-2: #212a27;
      --border: #303b37;
      --text: #e9ece9;
      --text-muted: #9aa39d;
      --text-faint: #6b756f;
      --accent: #4fa595;
      --accent-strong: #6dbcac;
      --accent-tint: #1e2f2b;
      --amber: #d99a4d;
      --amber-tint: #2e2618;
      --danger: #d97a67;
      --focus-ring: #4fa59555;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -10px rgba(0,0,0,0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #141a18;
    --surface: #1b2220;
    --surface-2: #212a27;
    --border: #303b37;
    --text: #e9ece9;
    --text-muted: #9aa39d;
    --text-faint: #6b756f;
    --accent: #4fa595;
    --accent-strong: #6dbcac;
    --accent-tint: #1e2f2b;
    --amber: #d99a4d;
    --amber-tint: #2e2618;
    --danger: #d97a67;
    --focus-ring: #4fa59555;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -10px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand .mark {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand .mark svg { width: 22px; height: 22px; }

  .brand h1 {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.01em;
    margin: 0;
    line-height: 1;
    text-wrap: balance;
  }

  .brand .sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 3px;
    font-family: "IBM Plex Mono", monospace;
    letter-spacing: 0.02em;
  }

  .timer-bar {
    display: none;
    align-items: center;
    gap: 8px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--accent-strong);
    background: var(--accent-tint);
    border: 1px solid var(--accent);
    padding: 10px 16px;
    border-radius: 10px 10px 0 0;
    font-variant-numeric: tabular-nums;
    margin-bottom: -1px;
  }

  .timer-bar.show { display: flex; }

  .timer-bar.low {
    color: var(--danger);
    border-color: var(--danger);
    background: color-mix(in srgb, var(--danger) 14%, var(--surface));
  }

  .timer-bar.show + .away-banner + form.card,
  .timer-bar.show + form.card {
    border-top-left-radius: 0;
    border-top-right-radius: 0;
  }

  .away-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    background: var(--danger);
    padding: 10px 16px;
    flex-wrap: wrap;
  }

  .away-banner.show { display: flex; }

  .refullscreen-btn {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 7px;
    cursor: pointer;
  }

  .refullscreen-btn:hover { background: rgba(255,255,255,0.22); }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }

  .tab-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .tab-btn:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .tab-btn.locked {
    color: var(--text-faint);
    cursor: not-allowed;
  }

  .tab-btn.locked:hover { color: var(--text-faint); }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  form.card { padding: 8px; }

  .group {
    padding: 22px 22px 6px;
  }

  .group + .group {
    border-top: 1px solid var(--border);
  }

  .group-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent-strong);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .group-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text);
  }

  .field .hint {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 5px;
  }

  .field input[type="text"],
  .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 14.5px;
    color: var(--text);
    resize: vertical;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field textarea { min-height: 78px; line-height: 1.5; }

  .field input[type="text"]:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }

  .field input::placeholder,
  .field textarea::placeholder { color: var(--text-faint); }

  .submit-row {
    padding: 20px 22px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .submit-btn {
    appearance: none;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    padding: 12px 22px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  .submit-btn:hover { background: var(--accent-strong); }
  .submit-btn:active { transform: translateY(1px); }
  .submit-btn:disabled { opacity: 0.55; cursor: default; }
  .submit-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .status-msg {
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
  }
  .status-msg.ok { color: var(--accent-strong); }
  .status-msg.err { color: var(--danger); }

  /* responses panel */
  .resp-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .resp-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--text-muted);
  }

  .resp-count strong { color: var(--text); }

  .refresh-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    padding: 7px 13px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
  .refresh-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .entries { display: flex; flex-direction: column; gap: 12px; }

  .entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .entry summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .entry summary::-webkit-details-marker { display: none; }

  .entry-id {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }

  .entry-name {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-sbu {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-strong);
    background: var(--accent-tint);
    padding: 3px 8px;
    border-radius: 5px;
    flex-shrink: 0;
  }

  .entry-flag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--danger);
    background: color-mix(in srgb, var(--danger) 12%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border));
    padding: 3px 8px;
    border-radius: 5px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .entry-date {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text-faint);
    flex-shrink: 0;
  }

  .entry .chev {
    color: var(--text-faint);
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .entry[open] .chev { transform: rotate(90deg); }

  .entry-body {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 20px;
  }

  @media (max-width: 560px) {
    .entry-body { grid-template-columns: 1fr; }
  }

  .qa { min-width: 0; }
  .qa .q {
    font-size: 11.5px;
    color: var(--text-faint);
    margin-bottom: 3px;
  }
  .qa .a {
    font-size: 14px;
    color: var(--text);
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .qa .a:empty::before {
    content: "—";
    color: var(--text-faint);
  }
  .qa.wide { grid-column: 1 / -1; }

  .empty-state, .load-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-faint);
    font-size: 14px;
  }

  a.plain { color: var(--accent-strong); }

  ::selection { background: var(--accent-tint); }

  /* copy protection */
  body {
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
  }

  input, textarea {
    -webkit-user-select: text;
    -moz-user-select: text;
    user-select: text;
  }

  .copy-toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(12px);
    background: var(--text);
    color: var(--bg);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 9px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 999;
    max-width: 88vw;
    text-align: center;
  }

  .copy-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .copy-toast { transition: none; }
  }
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 20V10L9 13V10L15 13V10L21 6V20H3Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M7 20V16" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 20V16" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M17 20V16" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Plant Pulse</h1>
        <div class="sub">MONTHLY SBU REPORT</div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab-btn active" id="tab-submit" role="tab" aria-selected="true">Submit report</button>
      <button class="tab-btn" id="tab-view" role="tab" aria-selected="false">View responses</button>
    </div>
  </header>

  <div class="panel active" id="panel-submit">
    <div class="timer-bar" id="timer-badge" role="status" aria-live="polite">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 9v4l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 2h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="timer-bar-text" id="timer-text"></span>
    </div>
    <div class="away-banner" id="away-banner" role="status" aria-live="assertive">
      <span id="away-banner-text"></span>
      <button type="button" id="refullscreen-btn" class="refullscreen-btn">Return to fullscreen</button>
    </div>
    <form class="card" id="report-form" autocomplete="off">
      <div class="group">
        <p class="group-label">Identity</p>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required>
        </div>
        <div class="field">
          <label for="sbu">SBU</label>
          <input type="text" id="sbu" name="sbu" placeholder="Strategic business unit" required>
        </div>
      </div>

      <div class="group">
        <p class="group-label">Plant performance</p>
        <div class="field">
          <label for="plant_capacity">What is your plant capacity?</label>
          <input type="text" id="plant_capacity" name="plant_capacity" placeholder="e.g. 12,000 units/day">
        </div>
        <div class="field">
          <label for="oee_this_month">What is the OEE this month in your plant?</label>
          <input type="text" id="oee_this_month" name="oee_this_month" placeholder="e.g. 78%">
        </div>
        <div class="field">
          <label for="five_s_score">What is the 5S score of this month?</label>
          <input type="text" id="five_s_score" name="five_s_score" placeholder="e.g. 4.2 / 5">
        </div>
        <div class="field">
          <label for="spc_meaning">What do you mean by SPC?</label>
          <textarea id="spc_meaning" name="spc_meaning" placeholder="Your explanation"></textarea>
        </div>
        <div class="field">
          <label for="top_npt">What is the top most NPT at your plant, except unavailable order?</label>
          <textarea id="top_npt" name="top_npt" placeholder="Describe the leading non-productive time cause"></textarea>
        </div>
        <div class="field">
          <label for="average_ot">What is the average OT at your plant?</label>
          <input type="text" id="average_ot" name="average_ot" placeholder="e.g. 1.5 hrs/day">
        </div>
      </div>

      <div class="group">
        <p class="group-label">Improvement activity</p>
        <div class="field">
          <label for="ic_card_initiated">Number of IC cards initiated this month?</label>
          <input type="text" id="ic_card_initiated" name="ic_card_initiated" placeholder="e.g. 6">
        </div>
        <div class="field">
          <label for="kaizen_given">How many kaizens have you given so far?</label>
          <input type="text" id="kaizen_given" name="kaizen_given" placeholder="e.g. 14">
        </div>
        <div class="field">
          <label for="training_given">What training have you given this month?</label>
          <textarea id="training_given" name="training_given" placeholder="List the training sessions delivered"></textarea>
        </div>
      </div>

      <div class="group">
        <p class="group-label">Reporting &amp; systems</p>
        <div class="field">
          <label for="report_work_hours_per_day">How many hours do you spend on report work per day?</label>
          <input type="text" id="report_work_hours_per_day" name="report_work_hours_per_day" placeholder="e.g. 2 hrs">
        </div>
        <div class="field">
          <label for="erp_oee_problem">What problem did you face with ERP OEE?</label>
          <textarea id="erp_oee_problem" name="erp_oee_problem" placeholder="Describe any issues"></textarea>
        </div>
      </div>

      <div class="group">
        <p class="group-label">Summary</p>
        <div class="field">
          <label for="last_working_day_activity">Write down all your activity on your last working day.</label>
          <textarea id="last_working_day_activity" name="last_working_day_activity" placeholder="Walk through the day"></textarea>
        </div>
        <div class="field">
          <label for="monthly_summary_activity">Write a summary of activity with results this month.</label>
          <textarea id="monthly_summary_activity" name="monthly_summary_activity" placeholder="Summarize the month's work and outcomes" style="min-height: 110px;"></textarea>
          <p class="hint">This closes out the report — everything above feeds into this summary.</p>
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" class="submit-btn" id="submit-btn">Submit report</button>
        <span class="status-msg" id="status-msg"></span>
      </div>
    </form>
  </div>

  <div class="panel" id="panel-view">
    <div class="resp-bar">
      <span class="resp-count" id="resp-count">Loading…</span>
      <button class="refresh-btn" id="refresh-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12a9 9 0 1 1-2.64-6.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M21 3v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Refresh
      </button>
    </div>
    <div class="entries" id="entries"></div>
  </div>
</div>

<div class="copy-toast" id="copy-toast" role="status" aria-live="polite">Copying is disabled on this page.</div>

<script>
  const SUPABASE_URL = "https://vpwbcuxwxkqvauffqooj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_1zZ68nxCL0XK0gPQDG5fsg_CqWCCBEU";
  const TABLE = "monthly_plant_report_responses";

  const FIELD_LABELS = {
    plant_capacity: "Plant capacity",
    oee_this_month: "OEE this month",
    five_s_score: "5S score this month",
    spc_meaning: "SPC meaning",
    ic_card_initiated: "IC cards initiated",
    kaizen_given: "Kaizens given",
    top_npt: "Top NPT (excl. unavailable order)",
    average_ot: "Average OT",
    training_given: "Training given this month",
    report_work_hours_per_day: "Report work hrs/day",
    erp_oee_problem: "ERP OEE problem",
    last_working_day_activity: "Last working day activity",
    monthly_summary_activity: "Monthly summary"
  };

  const WIDE_FIELDS = new Set(["top_npt", "training_given", "erp_oee_problem", "spc_meaning", "last_working_day_activity", "monthly_summary_activity"]);

  const tabSubmit = document.getElementById("tab-submit");
  const tabView = document.getElementById("tab-view");
  const panelSubmit = document.getElementById("panel-submit");
  const panelView = document.getElementById("panel-view");

  function activateTab(which) {
    const isSubmit = which === "submit";
    tabSubmit.classList.toggle("active", isSubmit);
    tabView.classList.toggle("active", !isSubmit);
    tabSubmit.setAttribute("aria-selected", String(isSubmit));
    tabView.setAttribute("aria-selected", String(!isSubmit));
    panelSubmit.classList.toggle("active", isSubmit);
    panelView.classList.toggle("active", !isSubmit);
    if (!isSubmit) loadResponses();
  }

  let formLocked = false;

  tabSubmit.addEventListener("click", () => activateTab("submit"));
  tabView.addEventListener("click", () => {
    if (formLocked) {
      flashToast("Finish or submit this report before switching tabs.");
      return;
    }
    activateTab("view");
  });
  document.getElementById("refresh-btn").addEventListener("click", loadResponses);

  function lockTabs() {
    formLocked = true;
    tabView.classList.add("locked");
    tabView.setAttribute("aria-disabled", "true");
  }

  function unlockTabs() {
    formLocked = false;
    tabView.classList.remove("locked");
    tabView.removeAttribute("aria-disabled");
  }

  const form = document.getElementById("report-form");
  const submitBtn = document.getElementById("submit-btn");
  const statusMsg = document.getElementById("status-msg");

  let reportSaved = false;

  async function submitReport(reason) {
    if (reportSaved) return;
    submitBtn.disabled = true;
    statusMsg.textContent = reason === "timeout" ? "Time's up — submitting…" : "Submitting…";
    statusMsg.className = "status-msg";

    const data = Object.fromEntries(new FormData(form).entries());
    data.focus_lost_count = focusLostCount;

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(data)
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `Request failed (${res.status})`);
      }

      reportSaved = true;
      stopTimer();
      unlockTabs();
      exitLockdown();
      statusMsg.textContent = reason === "timeout" ? "Time ran out — saved what you had." : "Saved. Thank you.";
      statusMsg.className = "status-msg ok";
      form.reset();
    } catch (err) {
      statusMsg.textContent = "Couldn't save — try again.";
      statusMsg.className = "status-msg err";
      console.error(err);
    } finally {
      submitBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    submitReport("manual");
  });

  // --- 25-minute auto-submit timer ---------------------------------------
  // Starts on the first interaction with any form field, not on page load.
  const TIMER_MS = 25 * 60 * 1000;
  const timerBar = document.getElementById("timer-badge");
  const timerText = document.getElementById("timer-text");
  let timerDeadline = null;
  let timerInterval = null;

  function formatRemaining(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function tickTimer() {
    const remaining = timerDeadline - Date.now();
    if (remaining <= 0) {
      timerText.textContent = "Time's up";
      stopTimer();
      submitReport("timeout");
      return;
    }
    timerText.textContent = `${formatRemaining(remaining)} remaining to complete this report`;
    timerBar.classList.toggle("low", remaining <= 2 * 60 * 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    timerBar.classList.remove("show");
  }

  function startTimerOnce() {
    if (timerDeadline || reportSaved) return;
    lockTabs();
    enterLockdown();
    timerDeadline = Date.now() + TIMER_MS;
    timerBar.classList.add("show");
    tickTimer();
    timerInterval = setInterval(tickTimer, 1000);
  }

  form.addEventListener("focusin", startTimerOnce);
  form.addEventListener("click", startTimerOnce);
  form.addEventListener("keydown", startTimerOnce);

  // --- Screen lock-in: fullscreen + leave detection -----------------------
  // A webpage cannot force someone to stay on it — that's an OS/browser
  // control no site is allowed to override. This does the closest real
  // equivalent: goes fullscreen once they start, and every time they leave
  // (switch tabs/apps, exit fullscreen) it's counted and saved with the
  // report, so it's visible afterward rather than silently missed.
  let focusLostCount = 0;
  const awayBanner = document.getElementById("away-banner");
  const awayBannerText = document.getElementById("away-banner-text");
  const refullscreenBtn = document.getElementById("refullscreen-btn");
  const fullscreenSupported = !!(document.documentElement.requestFullscreen && document.exitFullscreen);

  if (!fullscreenSupported) refullscreenBtn.style.display = "none";

  function enterLockdown() {
    if (fullscreenSupported && !document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }

  function exitLockdown() {
    awayBanner.classList.remove("show");
    if (fullscreenSupported && document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
  }

  function noteLeftPage() {
    focusLostCount++;
  }

  function showAwayBanner() {
    if (!formLocked || reportSaved) return;
    const times = focusLostCount === 1 ? "1 time" : `${focusLostCount} times`;
    awayBannerText.textContent = `You left the page ${times} while filling this in — it's recorded with your submission.`;
    awayBanner.classList.add("show");
  }

  document.addEventListener("visibilitychange", () => {
    if (!formLocked || reportSaved) return;
    if (document.hidden) {
      noteLeftPage();
    } else {
      showAwayBanner();
    }
  });

  document.addEventListener("fullscreenchange", () => {
    if (!formLocked || reportSaved) return;
    if (!document.fullscreenElement && !document.hidden) {
      noteLeftPage();
      showAwayBanner();
    }
  });

  refullscreenBtn.addEventListener("click", () => {
    enterLockdown();
    awayBanner.classList.remove("show");
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function formatDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch {
      return iso;
    }
  }

  async function loadResponses() {
    const entriesEl = document.getElementById("entries");
    const countEl = document.getElementById("resp-count");

    entriesEl.innerHTML = `<div class="load-state">Loading responses…</div>`;
    countEl.textContent = "Loading…";

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=submitted_at.desc`, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const rows = await res.json();

      countEl.innerHTML = `<strong>${rows.length}</strong> response${rows.length === 1 ? "" : "s"} recorded`;

      if (rows.length === 0) {
        entriesEl.innerHTML = `<div class="empty-state">No reports submitted yet.</div>`;
        return;
      }

      entriesEl.innerHTML = rows.map(row => {
        const qaHtml = Object.keys(FIELD_LABELS).map(key => {
          const wide = WIDE_FIELDS.has(key) ? " wide" : "";
          return `<div class="qa${wide}">
            <div class="q">${escapeHtml(FIELD_LABELS[key])}</div>
            <div class="a">${escapeHtml(row[key])}</div>
          </div>`;
        }).join("");

        return `<details class="entry">
          <summary>
            <div class="entry-id">
              <span class="entry-name">${escapeHtml(row.name) || "Unnamed"}</span>
              <span class="entry-sbu">${escapeHtml(row.sbu) || "—"}</span>
              ${Number(row.focus_lost_count) > 0 ? `<span class="entry-flag" title="Left the page while filling this in">left page × ${Number(row.focus_lost_count)}</span>` : ""}
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="entry-date">${formatDate(row.submitted_at)}</span>
              <span class="chev">&#9656;</span>
            </div>
          </summary>
          <div class="entry-body">${qaHtml}</div>
        </details>`;
      }).join("");
    } catch (err) {
      entriesEl.innerHTML = `<div class="empty-state">Couldn't load responses. ${escapeHtml(err.message)}</div>`;
      countEl.textContent = "";
      console.error(err);
    }
  }

  // --- Copy protection ---------------------------------------------------
  // Blocks copying page content (right-click, Ctrl/Cmd+C, drag-out, dev-tools
  // "Copy" menu) outside of the form's own inputs and textareas, where normal
  // typing/editing/cut/paste still works. This deters casual copying — it is
  // not a security boundary; anyone with browser dev tools can still read
  // the page source.
  const copyToast = document.getElementById("copy-toast");
  let toastTimer = null;

  function isEditable(el) {
    return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
  }

  function flashToast(message) {
    copyToast.textContent = message;
    copyToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => copyToast.classList.remove("show"), 2200);
  }

  document.addEventListener("copy", (e) => {
    if (isEditable(document.activeElement)) return;
    e.preventDefault();
    flashToast("Copying is disabled on this page.");
  });

  document.addEventListener("cut", (e) => {
    if (isEditable(document.activeElement)) return;
    e.preventDefault();
  });

  document.addEventListener("contextmenu", (e) => {
    if (isEditable(e.target)) return;
    e.preventDefault();
    flashToast("Right-click is disabled on this page.");
  });

  document.addEventListener("dragstart", (e) => {
    if (isEditable(e.target)) return;
    e.preventDefault();
  });

  document.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();
    const meta = e.ctrlKey || e.metaKey;
    if (!meta) return;
    if (isEditable(document.activeElement)) return;
    if (key === "c" || key === "x" || key === "s" || key === "p" || key === "u") {
      e.preventDefault();
      flashToast("Copying is disabled on this page.");
    }
  });
</script>
